---
configuration:
  llm_provider:
    name: LLM provider
    description: >-
      Which model answers. Anthropic is Claude, Ollama runs locally on your own
      hardware.
  llm_model:
    name: Model
    description: Model name. Leave empty to use the provider's default.
  anthropic_api_key:
    name: Anthropic API key
    description: Required for the Anthropic provider. Create one at console.anthropic.com.
  openai_api_key:
    name: OpenAI API key
    description: Required for the OpenAI provider.
  openai_base_url:
    name: OpenAI base URL
    description: Override for OpenAI-compatible endpoints. Leave empty for OpenAI itself.
  openai_max_tokens:
    name: OpenAI max tokens
    description: Upper limit on the response length.
  reasoning_effort:
    name: Reasoning effort
    description: >-
      Sent as reasoning_effort on OpenAI-compatible calls. Leave empty to not
      send it. Newer OpenAI models (GPT-5.6, GPT-6) refuse tools over this API
      unless it is none, and Gemini works best with low. A model that rejects
      the setting simply gets it no more.
  ollama_base_url:
    name: Ollama base URL
    description: >-
      Required for the Ollama provider, for example
      http://192.168.1.10:11434/v1.
  custom_prompt:
    name: Custom prompt
    description: >-
      Added to the system prompt. Use it to give the assistant a name and a
      personality.
  action_done_reply:
    name: Reply after an action
    description: >-
      What the assistant says when it has done what you asked but the model
      added no words of its own, which some OpenAI-compatible models such as
      Gemini often do. Leave empty for "Done.". If you talk to it in another
      language, write it in that language, for example "Hotovo." or
      "Erledigt.". Used with the openai and ollama providers.
  layout_from_exposed:
    name: Layout from exposed entities
    description: >-
      Build the home layout sent with every request from the entities exposed
      to Assist. Off filters by device type instead. Default on.
  tools_from_exposed:
    name: Tools limited to exposed entities
    description: >-
      The assistant can read and control only the entities exposed to Assist,
      like Home Assistant's own agent; if nothing is exposed, it reaches
      nothing. Off lets it reach the whole house. Either way it sticks to
      everyday device control and never restarts Home Assistant, the host or
      add-ons, or runs commands. Default on.
  max_output_tokens:
    name: Maximum answer length
    description: >-
      How much room one written answer gets, counted in tokens. Leave this empty
      and Home Mind chooses for you. Raise it if long answers stop before they
      finish, which is most likely when you ask about several sensors at once or
      over a long period. Longer answers cost a little more. Spoken answers are
      not affected and stay short, because they are read out loud.
  device_overrides:
    name: Device overrides
    description: >-
      JSON of per-entity light capability overrides. Use when a light reports
      the wrong colour modes to Home Assistant.
  memory_token_limit:
    name: Memory token limit
    description: How many tokens of recalled memory may be added to a prompt.
  memory_cleanup_interval_hours:
    name: Memory cleanup interval
    description: Hours between prunes of faded memories. 0 disables cleanup.
  conversation_storage:
    name: Conversation storage
    description: >-
      sqlite keeps conversation history across restarts, memory forgets it when
      the add-on stops.
  log_level:
    name: Log level
    description: Also controls how much Shodh Memory logs.
  api_token:
    name: API token
    description: >-
      Bearer token required on API requests from the start. Leave empty and
      the add-on creates a token itself and hands it to the Home Mind
      integration (0.11.0 or later); the API requires it once the
      integration has used it. Set your own if anything else, such as your
      own scripts, talks to the add-on directly.
  ha_url:
    name: Home Assistant URL
    description: >-
      Advanced. Leave empty to use this Home Assistant through the Supervisor
      proxy. Set it only to control a different instance.
  ha_token:
    name: Home Assistant token
    description: >-
      Advanced. Long-lived access token, required only together with a Home
      Assistant URL.
  ha_skip_tls_verify:
    name: Skip TLS verification
    description: >-
      Advanced. Accept self-signed certificates on the remote Home Assistant.
network:
  3100/tcp: >-
    Home Mind API. Required by the Home Mind integration.
