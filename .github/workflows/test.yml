name: Test

# The only gate this project has ever had is a developer remembering to run
# `npm test`. That is thinner than it looks: the sqlite tests need a compiled
# native module, and a machine that blocks install scripts skips ten of them
# without saying so. A clean runner does not.
on:
  push:
    branches: [main]
  pull_request:

# The job token gets only what the jobs need. Without this it inherits the
# repository default, which CodeQL flags (actions/missing-workflow-permissions);
# a job that needs more, such as pushing an image, says so on the job itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/home-mind-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 24 on purpose: it is what home_mind/Dockerfile builds with, so CI
      # tests the runtime that actually ships rather than whatever is newest.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/home-mind-server/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
