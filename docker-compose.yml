# Home Mind - Docker Compose
# AI assistant for Home Assistant with cognitive memory

services:
  # Shodh Memory - Cognitive memory backend
  shodh:
    build:
      context: ./docker/shodh
    container_name: home-mind-shodh
    restart: unless-stopped
    environment:
      - SHODH_HOST=0.0.0.0
      - SHODH_PORT=3030
      - SHODH_DEV_API_KEY=${SHODH_API_KEY}
    volumes:
      - ${SHODH_DATA_PATH:-shodh_data}:/data
    ports:
      - "3030:3030"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - home-mind

  # Home Mind Server - API server
  server:
    build:
      context: ./src/home-mind-server
    container_name: home-mind-server
    restart: unless-stopped
    ports:
      - "${PORT:-3100}:3100"
    environment:
      - PORT=3100
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - LLM_MODEL=${LLM_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - REASONING_EFFORT=${REASONING_EFFORT:-}
      - ACTION_DONE_REPLY=${ACTION_DONE_REPLY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
      - HA_SKIP_TLS_VERIFY=${HA_SKIP_TLS_VERIFY:-false}
      - SHODH_URL=http://shodh:3030
      - SHODH_API_KEY=${SHODH_API_KEY}
      - MEMORY_TOKEN_LIMIT=${MEMORY_TOKEN_LIMIT:-1500}
      - CONVERSATION_STORAGE=${CONVERSATION_STORAGE:-memory}
      - CONVERSATION_DB_PATH=/data/conversations.db
      - CUSTOM_PROMPT=${CUSTOM_PROMPT:-}
      - DEVICE_OVERRIDES=${DEVICE_OVERRIDES:-}
      - API_TOKEN=${API_TOKEN:-}
      - API_TOKEN_AUTO=${API_TOKEN_AUTO:-}
      - API_TOKEN_STATE_PATH=/state/.api_token_confirmed
      - TZ=${TZ:-Europe/Prague}
    volumes:
      - conversation_data:/data
      - server_state:/state
    depends_on:
      shodh:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - home-mind

volumes:
  shodh_data:
    driver: local
  conversation_data:
    driver: local
  server_state:
    driver: local

networks:
  home-mind:
    driver: bridge
